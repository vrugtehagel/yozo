name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v7
      with:
        node-version: 26
    - run: npm run test
    - if: github.ref == 'refs/heads/main'
      run: npm ci && npm run build -- --verify
